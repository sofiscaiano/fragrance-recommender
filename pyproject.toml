[project]
name = "fragrantica-scraper"
version = "0.1.0"
description = "Scraper de Fragrantica para construir un dataset de sistema de recomendacion"
requires-python = ">=3.11"

dependencies = [
    "curl_cffi>=0.7",
    "selectolax>=0.3.21",
    "orjson>=3.10",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "polars>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
fragrantica = "fragrantica.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fragrantica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
