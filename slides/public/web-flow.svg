  <text x="294" y="398" fill="#1a1814" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="22">Puntúa</text>
  <text x="294" y="420" fill="#6f675f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">La nota entra al historial y esa tarjeta sale.</text>
