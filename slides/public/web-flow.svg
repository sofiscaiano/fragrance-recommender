  <text x="280" y="276" fill="#1a1814" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="24">Para vos</text>
  <text x="280" y="302" fill="#6f675f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="16">Two-stage sobre ese historial.</text>
  <text x="280" y="324" fill="#6f675f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">También más populares, tendencia y mejor puntuados.</text>
