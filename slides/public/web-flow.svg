  <text x="270" y="140" text-anchor="middle" fill="#1a1814" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="22">Conocido</text>
  <text x="270" y="166" text-anchor="middle" fill="#6f675f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">Pasa directo. Reviews y wardrobe no se recomiendan.</text>
