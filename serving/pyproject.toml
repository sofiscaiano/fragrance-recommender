[project]
name = "fragrantica-serving"
version = "0.1.0"
description = "API de recomendaciones de perfumes sobre el dataset de Fragrantica"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.7",
    "duckdb>=1.0",
    "recommendation-system",
    "scikit-learn==1.7.2",
]

[tool.uv.sources]
recommendation-system = { path = "../recommendation-system", editable = true }

[project.scripts]
fragrantica-serve = "fragrantica_serving.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fragrantica_serving"]
