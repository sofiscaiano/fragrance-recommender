services:
  api:
    build:
      context: ..
      dockerfile: serving/Dockerfile
    environment:
      FRAGRANTICA_MODEL: /models/serving.joblib
      FRAGRANTICA_DATA: /data
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    volumes:
      - ../recommendation-system/artifacts/serving.joblib:/models/serving.joblib:ro
      - ../scraper/data/final:/data:ro
    ports:
      - "127.0.0.1:8000:8000"

  web:
    image: node:22-bookworm-slim
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://127.0.0.1:8000}"
    volumes:
      - ../web:/web
      - web_node_modules:/web/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Definí TUNNEL_TOKEN en serving/.env}
    depends_on:
      - api
    profiles:
      - tunnel

volumes:
  web_node_modules:
