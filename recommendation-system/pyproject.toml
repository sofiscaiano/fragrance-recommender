[project]
name = "recommendation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "implicit>=0.7.3",
    "ipykernel>=7.3.0",
    "joblib>=1.5.2",
    "lightgbm>=4.6.0",
    "mlflow>=3.17.2",
    "numpy>=2.2.6",
    "optuna>=4.5.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "typer>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fragrantica_rec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
